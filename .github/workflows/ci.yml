name: Rust native matrix
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and report repository toolchain
        # Install reads rust-toolchain.toml; no second compiler version to update.
        # Keep local verification and every native runner on the same compiler.
        run: |
          rustup toolchain install --no-self-update
          rustup show
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev libclang-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --manifest-path vendor/scap/Cargo.toml --lib
      - name: Vendored capture formatting (Linux)
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path vendor/scap/Cargo.toml -- --check
      - name: Vendored capture strict lint (Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path vendor/scap/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ runner.os }}
          path: |
            target/release/lumen-desktop
            target/release/lumen-desktop.exe
