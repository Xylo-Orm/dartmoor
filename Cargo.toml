[package]
name = "lumen-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Desktop color synchronization for WLED and Home Assistant"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
scap = { path = "vendor/scap" }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
